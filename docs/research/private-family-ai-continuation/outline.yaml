- name: Private family deployment
  category: System design and governance
  description: 'Build a research-only deployment recommendation from primary documentation: Open WebUI and model-server
    integrations; verify voice API routes/settings rather than copying assumed defaults. Cover per-user account/chat/file/memory/vector-store
    isolation, permissions, retention/deletion, backups, egress/telemetry, access control, prompt injection and
    tool privileges, maintenance and upgrades. Offer existing-hardware-first and stronger-server conditional stacks,
    not a purchase recommendation. Distinguish open-weight versus OSI open-source, exact model licenses versus UI/code/voice
    licenses, and local inference versus remote cloud privacy. Include end-to-end acceptance criteria and small-model
    evaluation-driven routing. Explicitly compare local embeddings/rerankers (including Qwen3 Embedding leads),
    retrieval citations, private/shared stores, deletion propagation, administrator visibility, additive permissions,
    persistent storage and tested backup recovery proposals. Offline settings alone do not prove no network egress.'
