- name: Model rankings and coding
  category: Reasoning and agentic tools
  description: Audit MiMo-V2.6-Pro versus actual MiMo-V2.6-Pro-RL or other released checkpoint, GLM-5.3, DeepSeek-V4.1-Flash-1017,
    Step 5 Preview, Kimi K3 and Qwen3.8 Max claims. Verify weights versus API-only availability, precise model IDs,
    parameters, context, release status and licenses. Compare reasoning, coding/tool execution and practical small-model
    alternatives. Audit AA/BenchLM rankings as unverified unless their primary methodology and exact comparable
    version support them. Vendor benchmark results must be identified as such. Scope is model identity and ability;
    hardware item owns detailed capacity planning. Include function-calling/structured-output evidence and effective
    long-context tests such as BFCL and RULER; advertised context is not measured effective context.
