name: Router and modules
on:
  pull_request:
  push:
    branches: [main, codex/shared-model-modules]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_openwebui_bundle.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/web-api.test.mjs
      - run: python -m compileall -q family_backend openwebui voice scripts
      - uses: actions/upload-artifact@v4
        with:
          name: family-ai-openwebui-imports
          path: dist/openwebui/
          retention-days: 7

